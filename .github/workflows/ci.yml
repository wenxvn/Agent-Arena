name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.13 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: 检查依赖锁
        run: uv lock --check
      - name: 安装冻结依赖
        run: uv sync --frozen --all-groups
      - name: 检查代码规范
        run: uv run ruff check .
      - name: 检查类型
        run: uv run mypy src
      - name: 运行离线测试
        run: uv run pytest -q
