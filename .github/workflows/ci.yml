name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.13 质量门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: 检查依赖锁
        run: uv lock --check
      - name: 安装冻结依赖
        run: uv sync --frozen --all-groups --extra web
      - name: 检查代码规范
        run: uv run ruff check .
      - name: 检查类型
        run: uv run mypy src
      - name: 运行离线测试
        run: uv run pytest -q --junitxml=pytest-report.xml
      - name: 汇总失败用例
        if: failure()
        run: uv run python scripts/ci_failures.py pytest-report.xml
      - name: V8/V9 冻结校验
        run: uv run python -m agent_arena.v10.freeze verify
      - name: V10 主指标公式级复算（30/30、0 不一致）
        run: uv run python -m agent_arena.v10.recompute --check
      - name: V10 指标独立复核（0 违规、回放确定、seed 互异）
        run: uv run python -m agent_arena.v10.independent_check --check
      - name: V11 本地网页离线验收（30 图 + 服务层 + 导出 + 预算）
        run: uv run python scripts/verify_v11.py
      - name: V12 Lab 离线验收（契约 + 父子实验 + 预算 + 可视化 + 导出复算）
        run: uv run python scripts/verify_v12.py --report runs/v12/selfcheck.json
      - name: V13 Lab 1.1 离线验收（重复身份 + 可比性 + 消融 + 效度 + 报告 + 账本）
        run: uv run python scripts/verify_v13.py --report runs/v13/selfcheck.json

  lab-e2e:
    name: V12 Lab 浏览器端到端（无 API Key）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: 安装依赖与浏览器
        run: |
          uv sync --frozen --all-groups --extra web
          uv run --with playwright playwright install --with-deps chromium
      - name: Lab E2E（配置 → 预检 → 离线提交 → 监控 → 结果 → 导出）
        run: uv run --with playwright python scripts/e2e_lab.py --start --port 8512
