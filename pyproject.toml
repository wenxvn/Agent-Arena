[project]
name = "agent-arena"
version = "0.1.0"
description = "用于研究 LLM Agent 行为的确定性实验环境。"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "openai>=1.109.0,<2.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pydantic-settings>=2.10.0,<3.0.0",
    "typer>=0.16.0,<1.0.0",
]

[project.scripts]
agent-arena = "agent_arena.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.17.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 测试会导入 scripts/run_*.py；显式把仓库根加入 sys.path，
# 避免依赖 `python -m pytest` 的 CWD 行为（`uv run pytest` 不会自动加入）。
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100
# worlds/v4/*/planning 是手写离线审计脚本（见 worlds/v4/AGENTS.md），不属于
# `src/agent_arena` 包；其行宽与写法按设计阶段约定保留，不纳入包级 lint。
extend-exclude = ["worlds/v4/**/planning"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["agent_arena"]
