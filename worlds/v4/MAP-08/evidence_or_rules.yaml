rules:
  experiment_X: {location: X, duration_ticks: 2, partition: [B, [D, F]]}
  experiment_Y: {location: Y, duration_ticks: 2, partition: [D, [B, F]]}
  leak_pressure: {initial: 1.0, per_unsealed_tick: 0.5, safe_at: 7.0, fail_if_gt: 7.0}
