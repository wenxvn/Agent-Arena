  test_signature_table:
    B: {X: pulse_amber, Y: pulse_slate}
    D: {X: pulse_slate, Y: pulse_cobalt}
    F: {X: pulse_slate, Y: pulse_slate}
  base_prior: {B: 0.3333333333, D: 0.3333333333, F: 0.3333333334}
  prior_control_counts:
    B_heavy_10: {B: 6, D: 2, F: 2}
    D_heavy_10: {B: 2, D: 6, F: 2}
  entropy_bits_initial: 1.5849625
  expected_entropy_after_first_test_bits: 0.6666667
  expected_information_gain_bits: 0.9182958
